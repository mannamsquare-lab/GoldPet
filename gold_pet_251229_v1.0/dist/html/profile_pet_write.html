<!DOCTYPE html>
<html lang="ko">
<head>
    <title>골든 펫</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">

    <meta name="Description" content="골든 펫">
    <meta name="Keywords" content="골든 펫">
    <meta name="Author" content="골든 펫">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="골든 펫">
    <meta property="og:description" content="골든 펫">
    <meta property="og:image" content="">
    <meta property="og:site_name" content="골든 펫">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
</head>
<body>
<div id="wrap">
    <!--header-->
	<header id="header">
	    <div class="header_wrap">
	        <a href=""><img src="../assets/images/layout/logo.svg" alt="골든 펫 로고"></a>
	        <ul class="header_util">
	            <li><button type="button"><img src="../assets/images/layout/header_icon01.svg" alt="G아이콘"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon02.svg" alt="알림"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon03.svg" alt="프로필"></button></li>
	        </ul>
	    </div>
	</header>
	<!--//header-->
    <div id="profileContainer">
	    <div class="profile_write">
	        <div class="profile_img_edit">
	            <!--
	            profile_img 내에 이미지 태그 넣으면 src대로 이미지 노출,
	            반려동물 none 이미지는 img 태그 삭제 후 profile_img에 pet_none class 넣으면 노출
	            -->
	            <div class="profile_img pet_none"><img src="../assets/images/main/main_slide_butler02.png" alt=""></div>
	        </div>
	        <div class="name_input">
	            <label for="name">이름</label>
	            <input type="text" id="name" placeholder="이름을 적어주세요.">
	        </div>
	        <div class="profile_write_wrap">
	            <strong>기본 정보</strong>
	            <div class="profile_write_box pink_color">
	                <div class="write_box">
	                    <label for="pet_age">나이</label>
	                    <input type="text" id="pet_age" placeholder="나이를 입력해주세요.">
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_gender">성별</label>
	                    <select name="" id="pet_gender">
	                        <option value="man">남아</option>
	                        <option value="woman">여아</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_neutered">중성화</label>
	                    <select name="" id="pet_neutered">
	                        <option value="">선택해주세요</option>
	                    </select>
	                </div>
	                <div class="write_box">
	                    <label for="pet_breed">품종</label>
	                    <input type="text" id="pet_breed" placeholder="품종을 입력해주세요.">
	                </div>
	            </div>

	            <strong>성향</strong>
	            <div class="profile_write_box purple_color">
	                <div class="write_box write_select">
	                    <label for="pet_activity_level">활동성</label>
	                    <select name="" id="pet_activity_level">
	                        <option value="">선택해주세요</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_sociability">친화력</label>
	                    <select name="" id="pet_sociability">
	                        <option value="">선택해주세요</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_trainability">훈련도</label>
	                    <select name="" id="pet_trainability">
	                        <option value="">선택해주세요</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_barking_level">짖음</label>
	                    <select name="" id="pet_barking_level">
	                        <option value="">선택해주세요</option>
	                    </select>
	                </div>
	                <div class="write_box">
	                    <label for="pet_special_notes">특이사항</label>
	                    <textarea id="pet_special_notes" placeholder="특이사항을 적어주세요."></textarea>
	                </div>
	            </div>

	            <strong>알러지 정보</strong>
	            <div class="profile_write_box blue_color">
	                <div class="write_box write_select">
	                    <label for="pet_allergy_nuts">견과류</label>
	                    <select name="" id="pet_allergy_nuts">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_allergy_shellfish">갑각류</label>
	                    <select name="" id="pet_allergy_shellfish">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_allergy_egg_meat">달걀&육류</label>
	                    <select name="" id="pet_allergy_egg_meat">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_allergy_etc">기타</label>
	                    <select name="" id="pet_allergy_etc">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	            </div>

	            <strong>관심사</strong>
	            <div class="profile_write_box pink_color">
	                <div class="write_box write_select">
	                    <label for="pet_interest_toys">장난감 놀이</label>
	                    <select name="" id="pet_interest_toys">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_interest_walks">산책</label>
	                    <select name="" id="pet_interest_walks">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_interest_sleep">수명</label>
	                    <select name="" id="pet_interest_sleep">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	                <div class="write_box write_select">
	                    <label for="pet_interest_petting">쓰다듬기</label>
	                    <select name="" id="pet_interest_petting">
	                        <option value="">선택해주세요.</option>
	                    </select>
	                </div>
	            </div>
	        </div>
	        <button type="button" class="submit_btn">확인</button>
	    </div>
	</div>
	    
    <!--bottom nav-->
	<!--현재 페이지 button에 active 추가-->
	<div id="bottomNav">
	    <ul>
	        <li><button type="button" class="b_nav01 active">친구찾기</button></li>
	        <li><button type="button" class="b_nav02">채팅</button></li>
	        <li class="ai_btn"><button type="button"><img src="../assets/images/layout/b_fix_center_icon.png" alt="AI"></button></li>
	        <li><button type="button" class="b_nav03">산책</button></li>
	        <li><button type="button" class="b_nav04">커뮤니티</button></li>
	    </ul>
	</div>
	<!--//bottom nav-->
</div>
<script src="../assets/javascripts/plugin.js"></script>
<script src="../assets/javascripts/design_common.js"></script>
</body>
</html>
