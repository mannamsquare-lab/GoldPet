# ============================================================
# Nginx Host Configuration (Production with SSL)
# Derived from existing ciccosoft.conf
# ============================================================

# ------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect (All Domains)
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ciccosoft.co.kr www.ciccosoft.co.kr m.ciccosoft.co.kr api.ciccosoft.co.kr app.ciccosoft.co.kr jenkins.ciccosoft.co.kr mail.ciccosoft.co.kr admin.ciccosoft.co.kr;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 2. Frontend (React App) -> app.ciccosoft.co.kr
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.ciccosoft.co.kr;

    # SSL Config (Shared)
    include /etc/nginx/snippets/ssl_ciccosoft.conf;

    # React Build Output Directory
    # Ensure this path exists and contains index.html
    root /home/nuribom/www/ciccosoft/app/dist; 
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------
# 3. Admin Dashboard -> admin.ciccosoft.co.kr
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.ciccosoft.co.kr;

    # SSL Config (Shared)
    include /etc/nginx/snippets/ssl_ciccosoft.conf;

    # Admin Build Output Directory
    root /home/nuribom/www/ciccosoft/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------
# 3. Backend (API) -> api.ciccosoft.co.kr
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ciccosoft.co.kr;

    # SSL Config (Shared)
    include /etc/nginx/snippets/ssl_ciccosoft.conf;

    location / {
        proxy_pass http://127.0.0.1:8080; # Spring Boot
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------
# 4. Jenkins -> jenkins.ciccosoft.co.kr
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jenkins.ciccosoft.co.kr;

    # SSL Config (Shared)
    include /etc/nginx/snippets/ssl_ciccosoft.conf;

    location / {
        proxy_pass http://127.0.0.1:9090; # Jenkins
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------
# 5. Main Site / Mobile -> www / m / root
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ciccosoft.co.kr www.ciccosoft.co.kr m.ciccosoft.co.kr;

    # SSL Config (Shared)
    include /etc/nginx/snippets/ssl_ciccosoft.conf;

    root /home/nuribom/www/ciccosoft/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
