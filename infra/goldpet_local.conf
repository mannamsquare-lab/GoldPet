# ============================================================
# Nginx Host Configuration (Local Development - macOS)
# ============================================================

# 1. Frontend (React App) -> app.goldpet.local
server {
    listen 80;
    server_name app.goldpet.local;

    # React Build Output Directory (Local Absolute Path)
    root /Users/jioabang/Works/MANNAM/GoldPet/frontend/dist; 
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Admin Dashboard -> admin.goldpet.local
server {
    listen 80;
    server_name admin.goldpet.local;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Backend (API) -> api.goldpet.local
server {
    listen 80;
    server_name api.goldpet.local;

    location / {
        proxy_pass http://127.0.0.1:8081; # Spring Boot Local
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. Main Site Redirect (Optional)
server {
    listen 80;
    server_name goldpet.local www.goldpet.local;
    return 301 http://app.goldpet.local$request_uri;
}
