# Common SSL Settings for ciccosoft.co.kr
# Place this file in /etc/nginx/snippets/ssl_ciccosoft.conf

ssl_certificate /etc/letsencrypt/live/ciccosoft.co.kr/fullchain.pem; # managed by Certbot
ssl_certificate_key /etc/letsencrypt/live/ciccosoft.co.kr/privkey.pem; # managed by Certbot
include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
