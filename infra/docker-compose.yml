services:
  # 1. Database: PostgreSQL + PostGIS
  db:
    image: postgis/postgis:16-3.4
    restart: always
    container_name: goldpet-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    ports:
      - "5432:5432" # Exposed to host. Use Firewall to restrict if needed.
    networks:
      - goldpet-net
    shm_size: 1g

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    restart: always
    container_name: goldpet-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    networks:
      - goldpet-net

  # 3. Object Storage: MinIO
  minio:
    image: minio/minio
    restart: always
    container_name: goldpet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    networks:
      - goldpet-net

  # 4. Jenkins (CI/CD)
  jenkins:
    image: jenkins/jenkins:lts
    restart: always
    container_name: goldpet-jenkins
    user: root # Often needed for Docker-in-Docker functionality
    ports:
      - "9090:8080" # Host Port 9090 -> Container 8080 (Avoid conflict with standard web ports)
      - "50000:50000" # JNLP Agent
    volumes:
      - ./data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Allow Jenkins to spawn siblings
      # - /usr/bin/docker:/usr/bin/docker # Optional mapping if needed
    networks:
      - goldpet-net

  # 5. Spring Boot API
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: always
    container_name: goldpet-api
    ports:
      - "8080:8080" # Exposed to host loopback for Nginx Proxy (or bind 127.0.0.1:8080:8080)
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO (If used by Backend)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      - goldpet-net
    depends_on:
      - db
      - redis
      - minio

networks:
  goldpet-net:
    driver: bridge
