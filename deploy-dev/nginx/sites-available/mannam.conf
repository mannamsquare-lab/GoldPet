# ============================================================================
# MANNAM Square Nginx Configuration
# mannamsquare.com 도메인 및 서브도메인 통합 설정 파일
# ============================================================================
#
# 도메인 구조:
# - mannamsquare.com, www.mannamsquare.com  → Next.js 공식 웹사이트
# - api.mannamsquare.com                    → GoldPet Backend API (Spring Boot, 포트 8081)
# - app.mannamsquare.com                    → GoldPet Frontend (React SPA)
# - admin.mannamsquare.com                  → 관리자 페이지
# - m.mannamsquare.com                      → 모바일 웹 (정적 HTML)
# - s3.mannamsquare.com                     → MinIO Object Storage (S3 API)
# - jenkins.mannamsquare.com                → Jenkins CI/CD (별도 파일)
# - 만남광장.com (xn--hc0b21etukhno.com)    → www.mannamsquare.com 리다이렉트
# ============================================================================

# ----------------------------------------------------------------------------
# [0] 한글 도메인 리다이렉트
# 만남광장.com → www.mannamsquare.com
# Punycode: xn--hc0b21etukhno.com
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xn--hc0b21etukhno.com www.xn--hc0b21etukhno.com;

    # Let's Encrypt SSL 인증서 자동 갱신을 위한 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # www.mannamsquare.com으로 리다이렉트
    location / {
        return 301 https://www.mannamsquare.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name xn--hc0b21etukhno.com www.xn--hc0b21etukhno.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # www.mannamsquare.com으로 리다이렉트
    return 301 https://www.mannamsquare.com$request_uri;
}

# ----------------------------------------------------------------------------
# [1] 메인 도메인 - HTTP to HTTPS 리다이렉트
# mannamsquare.com, www.mannamsquare.com
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mannamsquare.com www.mannamsquare.com;

    # Let's Encrypt SSL 인증서 자동 갱신을 위한 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# [2] 메인 도메인 - HTTPS (Next.js 공식 웹사이트)
# mannamsquare.com, www.mannamsquare.com
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name mannamsquare.com www.mannamsquare.com;

    # 웹사이트 루트 디렉토리 (Next.js static export)
    root /home/dev/www/mannam/web;
    index index.html;

    # SSL 인증서 설정
    include /etc/nginx/ssl/ssl-params.conf;

    # Next.js static export 지원 (trailingSlash: true)
    # URL 패턴: /about/ → /about/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Next.js 빌드 파일 캐싱 (1년)
    # 파일명에 해시가 포함되므로 (예: main-abc123.js) 코드 변경 시 자동으로 새 파일 다운로드
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 이미지 파일 캐싱 (30일)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

# ----------------------------------------------------------------------------
# [3] 서브도메인 - HTTP to HTTPS 리다이렉트
# api, app, admin, m (모바일), s3 (MinIO Object Storage)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name m.mannamsquare.com admin.mannamsquare.com api.mannamsquare.com app.mannamsquare.com s3.mannamsquare.com minio.mannamsquare.com;

    # Let's Encrypt SSL 인증서 자동 갱신을 위한 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# [4] API 서버 - GoldPet Backend
# api.mannamsquare.com
# ----------------------------------------------------------------------------
# Spring Boot API 서버 (포트 8081)
# Jenkins가 8080 포트를 사용하므로 8081로 설정
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name api.mannamsquare.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (API 전용)
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    # Spring Boot API로 프록시
    location / {
        # 로컬 포트 8081로 요청 전달
        proxy_pass http://localhost:8081;

        # HTTP/1.1 사용 (WebSocket 지원)
        proxy_http_version 1.1;

        # WebSocket 업그레이드 헤더 전달
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 원본 호스트 정보 전달
        proxy_set_header Host $host;

        # 클라이언트 실제 IP 전달 (로깅 및 보안용)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HTTPS 프로토콜 정보 전달
        proxy_set_header X-Forwarded-Proto $scheme;

        # 캐시 우회 (동적 API 응답)
        proxy_cache_bypass $http_upgrade;

        # 이미지 업로드를 위한 요청 바디 크기 제한 (50MB)
        client_max_body_size 50M;
    }
}

# ----------------------------------------------------------------------------
# [5] Frontend 앱 - GoldPet React SPA
# app.mannamsquare.com
# ----------------------------------------------------------------------------
# React 빌드 파일 서빙 (Vite 빌드 결과물)
# SPA이므로 모든 경로를 index.html로 라우팅
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name app.mannamsquare.com;

    # React 빌드 파일 디렉토리
    root /home/dev/www/mannam/goldpet/frontend/dist;
    index index.html;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (Frontend 전용)
    access_log /var/log/nginx/app.access.log;
    error_log /var/log/nginx/app.error.log;

    # React Router 지원 (클라이언트 사이드 라우팅)
    # /walk, /profile 등 모든 경로를 index.html로 연결
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 강력 캐싱 (1년)
    # Vite/React가 빌드 시 파일명에 해시 추가 (예: index-abc123.js)
    # 코드 수정 시 해시가 달라져 브라우저가 자동으로 새 파일 다운로드
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # assets 폴더 캐싱 (Vite 빌드 결과물)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip 압축 활성화 (전송 속도 향상)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;
}

# ----------------------------------------------------------------------------
# [6] Admin 패널 - GoldPet 관리자 React SPA
# admin.mannamsquare.com
# ----------------------------------------------------------------------------
# React + Vite로 구현된 GoldPet 관리자 페이지
# BrowserRouter 사용하므로 SPA 라우팅 지원 필요
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name admin.mannamsquare.com;

    # Admin React 빌드 파일 디렉토리
    root /home/dev/www/mannam/goldpet/admin/dist;
    index index.html;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (Admin 전용)
    access_log /var/log/nginx/admin.access.log;
    error_log /var/log/nginx/admin.error.log;

    # React Router 지원 (클라이언트 사이드 라우팅)
    # /users, /posts 등 모든 관리자 경로를 index.html로 연결
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 강력 캐싱 (1년)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # assets 폴더 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip 압축 활성화
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;
}

# ----------------------------------------------------------------------------
# [7] Mobile Web - 정적 HTML 페이지
# m.mannamsquare.com
# ----------------------------------------------------------------------------
# 모바일 웹 (정적 HTML)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name m.mannamsquare.com;

    # 정적 HTML 파일 디렉토리
    root /home/dev/www/mannam/html;
    index index.html;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 정적 파일 서빙 (SPA 아님)
    location / {
        try_files $uri $uri/ =404;
    }
}

# ----------------------------------------------------------------------------
# [8] S3/MinIO Storage - 파일 스토리지 (S3 API)
# s3.mannamsquare.com
# ----------------------------------------------------------------------------
# MinIO Object Storage S3 API 프록시
# 업로드된 이미지, 파일 등 정적 파일 서빙
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name s3.mannamsquare.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (S3 전용)
    access_log /var/log/nginx/s3.access.log;
    error_log /var/log/nginx/s3.error.log;

    # MinIO S3 API로 프록시 (포트 9000)
    location / {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 파일 다운로드를 위한 큰 버퍼
        proxy_buffering off;
        proxy_request_buffering off;

        # 대용량 파일 업로드 지원 (100MB)
        client_max_body_size 100M;

        # 이미지 캐싱 (30일)
        expires 30d;
        add_header Cache-Control "public";
    }
}

# ----------------------------------------------------------------------------
# [9] MinIO Console - 관리자 웹 UI
# minio.mannamsquare.com
# ----------------------------------------------------------------------------
# MinIO 웹 콘솔 (버킷 관리, 파일 업로드 등)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name minio.mannamsquare.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (MinIO Console 전용)
    access_log /var/log/nginx/minio.access.log;
    error_log /var/log/nginx/minio.error.log;

    # MinIO Console로 프록시 (포트 9001)
    location / {
        proxy_pass http://localhost:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 지원 (Console 실시간 업데이트)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 파일 업로드 지원 (100MB)
        client_max_body_size 100M;
    }
}
