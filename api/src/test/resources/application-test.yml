# datasource는 IntegrationTestBase의 TestContainers + @DynamicPropertySource가 런타임에 주입한다.
# 이 파일에서 jdbc URL을 하드코딩하면 실수로 원격 dev DB를 가리킬 위험이 있어 비워둔다.
spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  cache:
    type: simple

app:
  encryption:
    key: "test-encryption-key-32-chars!!!"

jwt:
  secret: test-secret-key-for-testing-purposes-must-be-at-least-256-bits-long
  expiration: 3600000

logging:
  level:
    org.springframework.security: DEBUG
    com.goldpet: DEBUG
