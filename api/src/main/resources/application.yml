spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:goldpet}
    username: ${DB_USER:goldpet}
    password: ${DB_PASSWORD:goldpet123}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          naver:
            client-id: DcUxJg2b276bWaLQCCXe
            client-secret: _3WyWuvzxF
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
          kakao:
            client-id: cd01fabe952a3822ab1c46a2c75c162c
            client-secret: BuvZodDQRSEnHrlNLDVF3woqiVbsLhMm
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        #          apple:
        #            client-id: ${APPLE_CLIENT_ID}
        #            client-secret: ${APPLE_CLIENT_SECRET}
        #            client-authentication-method: client_secret_post
        #            authorization-grant-type: authorization_code
        #            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
        #            scope:
        #              - name
        #              - email
        #            client-name: Apple
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          apple:
            client-id: YOUR_APPLE_CLIENT_ID
            client-secret: YOUR_APPLE_CLIENT_SECRET
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Apple

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

app:
  frontend:
    url: ${FRONTEND_URL:https://www.ciccosoft.com}
  jwt:
    secret: ${JWT_SECRET:your_very_secure_and_long_jwt_secret_key_for_goldpet_application_2024}
    expiration-ms: 86400000 # 24 hours

  S3_ENDPOINT: http://localhost:9002
S3_ACCESS_KEY: goldpet-s3-access-key
S3_SECRET_KEY: goldpet-s3-secret-key
