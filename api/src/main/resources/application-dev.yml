spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # V68 가 V69/V70 보다 늦게 추가돼 스킵된 환경에서도 back-apply 되도록 허용.
    # V68/V71 모두 IF NOT EXISTS 라 재적용/순서 무관하게 안전. schema_history 정합 + validate 실패 방지.
    out-of-order: true

# BLOCKER #9 — Sentry. SENTRY_DSN_API 미설정 시 dsn 공백 → SDK no-op (이벤트 미전송).
sentry:
  dsn: ${SENTRY_DSN_API:}
  environment: dev
  release: ${SENTRY_RELEASE:goldpet-api@0.0.1-SNAPSHOT}
  traces-sample-rate: 0.1

# 개발 서버 환경 URL 설정 (mannamsquare.com)
app:
  encryption:
    # Legacy; unused under dual-key shape. Remove in follow-up after prod rotation.
    key: "${ENCRYPTION_KEY:MUST_BE_SET_VIA_ENV_VAR_DO_NOT_COMMIT}"
    key-primary: "${ENCRYPTION_KEY_PRIMARY:${ENCRYPTION_KEY:MUST_BE_SET_VIA_ENV_VAR_DO_NOT_COMMIT}}"
    key-secondary: "${ENCRYPTION_KEY_SECONDARY:}"
  frontend:
    url: https://app.mannamsquare.com
  admin:
    url: https://admin.mannamsquare.com
  cors:
    allowed-origins:
      - https://app.mannamsquare.com
      - https://admin.mannamsquare.com
      - https://mannamsquare.com
      - http://localhost:5173
      - http://localhost:5174

# Dev MinIO Configuration
S3_ENDPOINT: ${MINIO_ENDPOINT:http://minio:9000}
S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
S3_SECRET_KEY: ${MINIO_SECRET_KEY}
S3_PUBLIC_BUCKET_NAME: ${MINIO_PUBLIC_BUCKET:goldpet-public}
S3_PRIVATE_BUCKET_NAME: ${MINIO_PRIVATE_BUCKET:goldpet-private}

