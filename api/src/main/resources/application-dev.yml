spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

# 개발 서버 환경 URL 설정 (mannamsquare.com)
app:
  frontend:
    url: https://app.mannamsquare.com
  admin:
    url: https://admin.mannamsquare.com
  cors:
    allowed-origins:
      - https://app.mannamsquare.com
      - https://admin.mannamsquare.com
      - https://mannamsquare.com

# Dev MinIO Configuration
S3_ENDPOINT: ${MINIO_ENDPOINT:http://minio:9000}
S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
S3_SECRET_KEY: ${MINIO_SECRET_KEY}

# Naver Maps API (for geocoding location addresses)
# TODO: Add actual NCP credentials to environment variables
ncp:
  maps:
    client-id: ${NCP_MAPS_CLIENT_ID:}
    client-secret: ${NCP_MAPS_CLIENT_SECRET:}
