spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update # 로컬에서는 개발 편의를 위해 update 사용
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 로컬 환경 URL 설정
app:
  frontend:
    url: http://localhost:5173
  admin:
    url: http://localhost:5174
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://10.0.2.2:5173

# Local MinIO Configuration (Port 9100)
S3_ENDPOINT: http://localhost:9100
S3_PUBLIC_ENDPOINT: http://localhost:9100
S3_ACCESS_KEY: goldpet-s3-access-key
S3_SECRET_KEY: goldpet-s3-secret-key
