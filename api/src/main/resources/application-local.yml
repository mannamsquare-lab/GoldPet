spring:
  config:
    activate:
      on-profile: local
  
  jpa:
    hibernate:
      ddl-auto: update # 로컬에서는 개발 편의를 위해 update 사용
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Local MinIO Configuration (Port 9100)
S3_ENDPOINT: http://localhost:9100
S3_ACCESS_KEY: minioadmin
S3_SECRET_KEY: minioadmin
