name: goldpet
description: GoldPet - 반려동물 라이프 플랫폼
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.0.0

  # Navigation
  go_router: ^17.0.1

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Maps (Naver Maps)
  flutter_naver_map: ^1.3.1

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0-spm.1
  kakao_flutter_sdk_user: ^1.9.0
  flutter_naver_login: ^2.1.1

  # Firebase
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  firebase_analytics: ^12.1.0

  # Utils
  intl: ^0.20.2
  logger: ^2.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image
  image_picker: ^1.1.1
  permission_handler: ^12.0.1

  # WebSocket
  web_socket_channel: ^3.0.3
  stomp_dart_client: ^3.0.1
  kakao_flutter_sdk: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/common/
    - assets/images/splash/
    - assets/icons/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
