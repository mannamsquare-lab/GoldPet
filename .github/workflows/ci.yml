name: GoldPet CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build Backend
        run: ./gradlew build -x test
        working-directory: ./backend

      - name: Test Backend
        run: ./gradlew test
        working-directory: ./backend

  build-ai-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: ./ai-server

      # Add AI server tests here if available
      # - name: Test AI Server
      #   run: pytest

  build-docker-images:
    needs: [build-and-test-backend, build-ai-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Login to Docker Hub (or other registry) if needed for private images
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false # Set to true to push to registry
          tags: goldpet-api:latest

      - name: Build AI Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./ai-server
          push: false # Set to true to push to registry
          tags: goldpet-ai:latest

      - name: Build Nginx Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: false # Set to true to push to registry
          tags: goldpet-nginx:latest
