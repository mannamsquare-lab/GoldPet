server {
    server_name
        ciccosoft.co.kr
        www.ciccosoft.co.kr
        m.ciccosoft.co.kr
	jenkins.ciccosoft.co.kr
	mail.ciccosoft.co.kr
        api.ciccosoft.co.kr
        app.ciccosoft.co.kr;

    root /home/nuribom/www/ciccosoft/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ciccosoft.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ciccosoft.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = app.ciccosoft.co.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = api.ciccosoft.co.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = m.ciccosoft.co.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.ciccosoft.co.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ciccosoft.co.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name
        ciccosoft.co.kr
        www.ciccosoft.co.kr
        m.ciccosoft.co.kr
        api.ciccosoft.co.kr
        app.ciccosoft.co.kr;
    return 404; # managed by Certbot
}